<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#121826;--mute:#667085;--line:#dfe3ec;--pri:#23307a;--pri2:#1a2560;--on:#fff;--acc:#f2a900;--ok:#0f7a3d;--bad:#b42318;--warn:#b54708;--soft:#e8ebf8;--inp:#f8f9fc;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--card:#171c2e;--ink:#e8ebf5;--mute:#9aa3bd;--line:#2a3150;--pri:#7f8fff;--pri2:#9aa7ff;--on:#0e1220;--soft:#222a4a;--inp:#1d2338;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0e1220;--card:#171c2e;--ink:#e8ebf5;--mute:#9aa3bd;--line:#2a3150;--pri:#7f8fff;--pri2:#9aa7ff;--on:#0e1220;--soft:#222a4a;--inp:#1d2338;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:78px}
h1,h2,h3{margin:0;line-height:1.2}h3{font-size:15px;margin-bottom:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:var(--on);display:flex;align-items:center;gap:6px;height:52px;padding:0 8px}
:root[data-theme="dark"] .bar,:root:not([data-theme="light"]) .bar{--x:0}
.bar h1{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:inherit;font-size:24px;width:40px;height:40px;border-radius:10px}
.acts{display:flex;gap:6px}
.acts .btn{background:var(--acc);color:#241a00;padding:8px 12px;font-size:14px}
main{padding:12px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card.flat{border-radius:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);margin-bottom:-1px;cursor:pointer}
.row:first-child{border-radius:10px 10px 0 0}.row:last-child{border-radius:0 0 10px 10px;margin-bottom:12px}.row:only-child{border-radius:10px}
.rl{min-width:0}.rl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small,.mute{color:var(--mute);font-size:12.5px}
.rr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}.rr small{display:block;font-weight:400}
.empty{padding:26px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:10px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 10px;font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:4px;min-height:44px}
textarea{min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}

.btn.sec{background:var(--soft);color:var(--pri)}.btn.bad{background:var(--bad);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px}.btn.block{display:block;width:100%;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btns .btn{flex:1;min-width:120px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.k small{display:block}.k b{font-size:18px;font-variant-numeric:tabular-nums;display:block;margin-top:2px;overflow-wrap:anywhere}
.k.g{border-left-color:var(--ok)}.k.r{border-left-color:var(--bad)}.k.y{border-left-color:var(--acc)}
.hero{background:var(--pri);color:var(--on);border-radius:14px;padding:16px;margin-bottom:12px}
.hero small{color:inherit;opacity:.8}.hero b{display:block;font-size:30px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .hs{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}.hero .hs b{font-size:16px}

.badge.ok{background:#dcf5e5;color:#0f6b36}.badge.bad{background:#fde3e0;color:#9b1c12}.badge.warn{background:#fdecd0;color:#8a4205}

.scroll{overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}

.tbl tr.i td:first-child{padding-left:20px}
.tbl tr.dr td:last-child,.tbl tr.dr td.n{cursor:pointer;text-decoration:underline dotted}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{width:auto;flex:1;min-width:130px;margin:0}
.srch{display:flex;gap:8px;margin-bottom:10px}.srch input,.srch select{margin:0;flex:1}.srch select{flex:0 0 38%}
details.more{margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}details summary{cursor:pointer;font-weight:600;color:var(--pri)}
details.set{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:10px}details.set summary{padding:10px 0}details.set[open]{padding-bottom:12px}
.line{background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.lh{display:flex;gap:6px;align-items:center}.lh input{margin:0}.x{background:none;border:0;color:var(--bad);font-size:20px;width:40px;height:40px}
.lt{text-align:right;font-size:13px;color:var(--mute)}
.tot .t{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}.tot .t.big{font-size:19px;font-weight:800;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;font:inherit;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:54px}
.tabs button span{font-size:19px;line-height:1}.tabs button.on{color:var(--pri);font-weight:700}
#drawer{position:fixed;inset:0;z-index:40;visibility:hidden}#drawer.open{visibility:visible}
#drawer .sh{position:absolute;inset:0;background:rgba(10,14,30,.5);opacity:0;transition:opacity .2s}#drawer.open .sh{opacity:1}

#modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,30,.55);display:none;align-items:center;justify-content:center;padding:16px}#modal.show{display:flex}
#modal .bx{background:var(--card);border-radius:14px;padding:16px;max-width:460px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:70;display:none}#toast div{max-width:520px;margin:0 auto;padding:12px 14px;border-radius:10px;color:#fff;background:#222;box-shadow:0 6px 24px rgba(0,0,0,.25);font-weight:600}
#toast .err{background:var(--bad)}#toast .ok{background:var(--ok)}
.login{max-width:380px;margin:8vh auto 0;padding:18px}.login h1{font-size:28px;color:var(--pri);margin-bottom:4px}
.demo{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.demo button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 10px}
.inv{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:14px}.inv .tbl th{background:#fff;color:#444}.inv small{color:#555}.inv h2{font-size:19px}
.sig{display:flex;justify-content:space-between;margin-top:36px;font-size:12px;color:#555}.sig div{border-top:1px solid #777;padding-top:4px;width:42%;text-align:center}
.ph{display:none}
@media print{.bar,.tabs,.noprint,#drawer,#toast,#modal{display:none!important}body{background:#fff;color:#000;padding:0}:root{padding:0}main{max-width:none;padding:0}.card,.inv{border:0}.ph{display:block}.scroll{overflow:visible}}
</style>

<body>
<div id="app"></div><div id="modal" onclick="if(event.target===this)closeModal()"><div class="bx" id="mbx"></div></div><div id="toast"></div>
<script>
'use strict';
/* ================= BASICS ================= */
const KEY='bizbooks_v2',SK='bizbooks_me';
const AR='1100',AP='2000',INV='1200',TIN='1300',TOUT='2100',FA='1500',AD='1590',SALES='4000',SRET='4010',SDISC='4020',COGS='5000',DEPX='6900',SLOSS='6800',OBE='3200',OINC='4100',OLOSS='7100';
let DB=null,ME=null,IDX=null;
const ST={route:'home',arg:null,stack:[],f:{},rg:{},doc:null,menu:false};
const R={},LIST={};
const $=(s)=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v=id=>{const e=document.getElementById(id);return e?e.value:''};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const r2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const num=x=>{const n=parseFloat(String(x).replace(/,/g,''));return isFinite(n)?n:0};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dago=n=>addDays(today(),-n);
const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'';
const nf=new Intl.NumberFormat('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>{n=r2(n);return(n<0?'-':'')+(DB?DB.settings.cur:'Rs')+' '+nf.format(Math.abs(n))};
const N=n=>{n=r2(n);return n<0?'('+nf.format(-n)+')':nf.format(n)};
const inR=(d,f,t)=>(!f||d>=f)&&(!t||d<=t);
const byD=(a,b)=>a.date.localeCompare(b.date)||(a.t||0)-(b.t||0);
const byDD=(a,b)=>byD(b,a);
const opt=(v_,t,sel)=>`<option value="${esc(v_)}" ${String(v_)===String(sel)?'selected':''}>${esc(t)}</option>`;
const badge=(t,c)=>`<span class="badge ${c||''}">${t}</span>`;
const nx=p=>{DB.seq[p]=(DB.seq[p]||0)+1;return p+'-'+String(DB.seq[p]).padStart(5,'0')};
function save(){IDX=null;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){if(!ST.warned){ST.warned=1;toast('Browser storage unavailable: data will be lost when you close this page. Use Settings > Backup.','err')}}}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function tx(fn){const snap=JSON.stringify(DB);try{const r=fn();save();return r}catch(e){DB=JSON.parse(snap);IDX=null;try{save()}catch(x){}throw e}}
function act(fn){try{fn()}catch(e){toast(e.message||String(e),'err');console.error(e)}}
function toast(m,t){const e=$('#toast');e.innerHTML=`<div class="${t||'ok'}">${esc(m)}</div>`;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',t==='err'?4800:2200)}
function showModal(h){$('#mbx').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function ask(msg,fn,label,cls){ST.cb=fn;showModal(`<p>${msg}</p><div class="btns"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn ${cls||'bad'}" onclick="runCb()">${label||'Confirm'}</button></div>`)}
function runCb(){const f=ST.cb;closeModal();act(f)}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bb:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'bb:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}

/* ================= DEFAULT DATA ================= */
const COA=[['1000','Cash in Hand','asset','cash'],['1010','Main Bank Account','asset','bank'],['1020','Petty Cash','asset','cash'],['1100','Accounts Receivable','asset','ar'],['1200','Inventory','asset','inv'],['1300','Input Sales Tax (Recoverable)','asset','taxin'],['1400','Other Assets','asset',''],['1500','Fixed Assets (Cost)','asset','fa'],['1590','Accumulated Depreciation','asset','accdep'],
['2000','Accounts Payable','liability','ap'],['2100','Output Sales Tax Payable','liability','taxout'],['2200','Loans Payable','liability',''],['2300','Other Liabilities','liability',''],
['3000','Owner Capital','equity',''],['3100','Retained Earnings','equity',''],['3200','Opening Balance Equity','equity',''],
['4000','Sales Revenue','revenue','','sales'],['4010','Sales Returns','revenue','','salesRet'],['4020','Sales Discounts','revenue','','salesDisc'],['4100','Other Income','revenue','','otherInc'],['4110','Interest Income','revenue','','otherInc'],['4120','Cash Excess','revenue','','otherInc'],
['5000','Cost of Goods Sold','cogs','','cogs'],
['6000','Salaries & Wages','expense'],['6010','Rent','expense'],['6020','Electricity','expense'],['6030','Gas','expense'],['6040','Internet','expense'],['6050','Telephone','expense'],['6060','Fuel','expense'],['6070','Transport','expense'],['6080','Repairs','expense'],['6085','Maintenance','expense'],['6090','Office Expenses','expense'],['6100','Marketing & Advertising','expense'],['6110','Bank Charges','expense'],['6120','Insurance','expense'],['6130','Professional Fees','expense'],['6140','Taxes & Government Charges','expense'],['6150','Meals','expense'],['6160','Guest Expenses','expense'],['6170','Hospitality','expense'],['6180','Other Business Expenses','expense'],['6950','Cash Shortage','expense'],['6800','Stock Loss & Damage','expense'],['6900','Depreciation Expense','expense'],['6990','Miscellaneous Expenses','expense'],
['7000','Interest Expense','expense','','otherExp'],['7100','Other Losses','expense','','otherExp'],['7200','Income Tax Expense','expense','','tax']];
const TYPES={asset:'Assets',liability:'Liabilities',equity:'Equity',revenue:'Revenue',cogs:'Cost of Goods Sold',expense:'Expenses'};
function freshDB(){return{v:1,seq:{},
settings:{biz:'My Business',addr:'',phone:'',email:'',ntn:'',strn:'',logo:'',cur:'Rs',negStock:false,taxOn:false,autoBackup:'daily',lastBackup:'',fyStart:7,terms:'Goods once sold are returnable only with this invoice.',
taxes:[{name:'No Tax',rate:0},{name:'Sales Tax (edit to current rate)',rate:18}],
units:['pcs','box','ml','ltr','kg','g','dozen','bag'],unitConv:['box = 12 pcs','dozen = 12 pcs','kg = 1000 g','ltr = 1000 ml'],cats:['General','Grocery','Household','Electronics'],
expCats:[['Rent','6010'],['Electricity','6020'],['Gas','6030'],['Internet','6040'],['Telephone','6050'],['Salaries','6000'],['Transport','6070'],['Fuel','6060'],['Repairs','6080'],['Maintenance','6085'],['Meals','6150'],['Guest Expenses','6160'],['Hospitality','6170'],['Office Expenses','6090'],['Marketing','6100'],['Bank Charges','6110'],['Insurance','6120'],['Professional Fees','6130'],['Taxes & Govt Charges','6140'],['Miscellaneous','6990'],['Other Business Expenses','6180']].map(([name,acc])=>({name,acc}))},
users:[],accounts:COA.map(([code,name,type,sub,grp])=>({code,name,type,sub:sub||'',grp:grp||(type==='expense'?'opex':''),active:true,parent:''})).sort((a,b)=>a.code.localeCompare(b.code)),banks:[{code:'1010',bank:'Main Bank',title:'',no:'',iban:'',branch:'',type:'Current'}],recon:{},stmts:{},stmtLines:[],closings:[],recur:[],
journal:[],customers:[],suppliers:[],products:[],warehouses:[{id:'w1',name:'Main Business Stock',loc:'',mgr:''},{id:'w2',name:'Home Stock',loc:'Home',mgr:''}],stockTx:[],sales:[],salesReturns:[],purchases:[],purchaseReturns:[],payments:[],expenses:[],assets:[],depr:[],audit:[]}}
const ROLES={admin:{name:'Administrator',p:{all:'w'}},
accountant:{name:'Accountant',p:{dash:'w',sales:'w',purchase:'w',inventory:'w',expenses:'w',cash:'w',accounting:'w',assets:'w',reports:'w',settings:'r'}},
sales:{name:'Salesperson',p:{dash:'r',sales:'w',inventory:'r'}},
purchase:{name:'Purchase Officer',p:{dash:'r',purchase:'w',inventory:'r'}},
cashier:{name:'Cashier',p:{dash:'r',sales:'w',cash:'r',inventory:'r'}},
inventory:{name:'Inventory Manager',p:{dash:'r',inventory:'w',purchase:'r',sales:'r'}},
viewer:{name:'Viewer',p:{dash:'r',sales:'r',purchase:'r',inventory:'r',expenses:'r',cash:'r',accounting:'r',assets:'r',reports:'r'}}};
const can=(m,w)=>{if(!ME)return false;const p=ROLES[ME.role].p,l=p.all||p[m];return!!l&&(!w||l==='w')};
function need(m){if(!can(m,true))throw new Error('Your role ('+ROLES[ME.role].name+') is not allowed to do this.')}
function audit(action,module,rec,o,n){DB.audit.push({t:Date.now(),user:ME?ME.name:'system',action,module,rec,o:o==null?'':JSON.stringify(o),n:n==null?'':JSON.stringify(n)});if(DB.audit.length>3000)DB.audit.splice(0,500)}

/* ================= LOOKUPS ================= */
const acc=c=>DB.accounts.find(a=>a.code===c);
const accName=c=>{const a=acc(c);return a?a.code+' · '+a.name:c};
const prod=id=>DB.products.find(p=>p.id===id);
const cust=id=>DB.customers.find(c=>c.id===id);
const supp=id=>DB.suppliers.find(c=>c.id===id);
const custName=id=>id?(cust(id)||{}).name||'?':'Walk-in';
const suppName=id=>id?(supp(id)||{}).name||'?':'—';
const whName=id=>(DB.warehouses.find(w=>w.id===id)||{}).name||'?';
const payAccts=()=>DB.accounts.filter(a=>(a.sub==='cash'||a.sub==='bank')&&a.active);
const nat=c=>{const a=acc(c);return a&&(a.type==='asset'||a.type==='cogs'||a.type==='expense')?1:-1};
const outs=s=>r2(s.total-s.paid-(s.adj||0));

/* ================= LEDGER ENGINE (single source of truth) ================= */
function idx(){if(IDX)return IDX;IDX={};for(const j of DB.journal)for(const l of j.lines){(IDX[l.acc]=IDX[l.acc]||[]).push({d:j.date,dr:l.dr,cr:l.cr})}return IDX}
function net(c,f,t){let s=0;for(const x of idx()[c]||[])if(inR(x.d,f,t))s+=x.dr-x.cr;return r2(s)}
const bal=(c,f,t)=>r2(nat(c)*net(c,f,t));
function post(d){
 const lines=(d.lines||[]).map(l=>({acc:l.acc,dr:r2(l.dr||0),cr:r2(l.cr||0),party:l.party||null})).filter(l=>l.dr||l.cr);
 if(!d.date)throw new Error('Entry date is missing.');
 if(lines.length<2)throw new Error('A journal entry needs at least two lines.');
 for(const l of lines){const a=acc(l.acc);if(!a)throw new Error('Unknown account '+l.acc);if(!a.active)throw new Error('Account '+a.name+' is inactive.');if(l.dr<0||l.cr<0)throw new Error('Negative amounts are not allowed.');if(l.dr&&l.cr)throw new Error('A line cannot have both debit and credit.')}
 const D=r2(lines.reduce((s,l)=>s+l.dr,0)),C=r2(lines.reduce((s,l)=>s+l.cr,0));
 if(D!==C)throw new Error('Unbalanced entry: Debit '+D+' is not equal to Credit '+C+'.');
 const je={id:uid(),no:nx('JV'),date:d.date,ref:d.ref||'',desc:d.desc||'',lines,src:d.src||{type:'manual'},rev:false,t:Date.now(),by:ME?ME.name:'system'};
 DB.journal.push(je);IDX=null;return je}
function reverse(jid,desc){const j=DB.journal.find(x=>x.id===jid);if(!j||j.rev)throw new Error('Entry already reversed or missing.');
 const r=post({date:j.date,ref:j.ref,desc:desc||'Reversal of '+j.no,lines:j.lines.map(l=>({acc:l.acc,dr:l.cr,cr:l.dr,party:l.party})),src:{type:'reversal',id:j.src&&j.src.id,of:j.id}});j.rev=true;return r}
function chkFunds(a,amt){const x=acc(a);if(!x||!(x.sub==='cash'||x.sub==='bank'))throw new Error('Choose a cash or bank account.');if(x.sub==='cash'&&bal(a)+0.001<amt)throw new Error('Not enough money in '+x.name+' (balance '+money(bal(a))+').')}
function partyBal(t,id){let s=0;for(const j of DB.journal)for(const l of j.lines)if(l.party&&l.party.id===id)s+=t==='c'?l.dr-l.cr:l.cr-l.dr;return r2(s)}
function partyLines(id,t){const o=[];let b=0;[...DB.journal].sort(byD).forEach(j=>j.lines.forEach(l=>{if(l.party&&l.party.id===id){const x=t==='c'?l.dr-l.cr:l.cr-l.dr;b=r2(b+x);o.push({j,l,b})}}));return o}
function ledgerLines(c,f,t){let open=0;const out=[];[...DB.journal].sort(byD).forEach(j=>j.lines.forEach(l=>{if(l.acc===c){if(f&&j.date<f)open+=l.dr-l.cr;else if(!t||j.date<=t)out.push({j,l})}}));return{open:r2(open),lines:out}}

/* ================= STOCK ENGINE (weighted average) ================= */
const sq=(p,w)=>r2(DB.stockTx.reduce((a,s)=>s.prod===p&&(!w||s.wh===w)?a+s.qty:a,0));
const sv=p=>r2(DB.stockTx.reduce((a,s)=>s.prod===p?a+s.val:a,0));
const avgc=p=>{const q=sq(p);return q>0?sv(p)/q:((prod(p)||{}).cost||0)};
function outVal(p,q){const tq=sq(p),tv=sv(p);if(tq<=0)return r2(q*((prod(p)||{}).cost||0));if(q>tq)return r2(tv+(q-tq)*((prod(p)||{}).cost||0));return q>=tq?tv:r2(tv*q/tq)}
function stk(date,p,w,qty,val,type,ref,src,note){const o={id:uid(),date,prod:p,wh:w,qty:r2(qty),val:r2(val),type,ref:ref||'',src:src||null,note:note||'',t:Date.now()};DB.stockTx.push(o);const q=sq(p),v_=sv(p);o.rq=r2(q);o.rv=r2(v_);o.ra=q>0?r2(v_/q):0}
function totalStockValue(){return r2(DB.stockTx.reduce((a,s)=>a+s.val,0))}

/* ================= BUSINESS POSTING FUNCTIONS ================= */
function calc(items,rate){let gross=0,disc=0;items.forEach(i=>{i.amt=r2(i.qty*i.rate);gross+=i.amt;disc+=i.disc});gross=r2(gross);disc=r2(disc);const n=r2(gross-disc),tax=r2(n*rate/100);return{gross,disc,net:n,tax,total:r2(n+tax)}}
function unitConvs(){return(DB.settings.unitConv||[]).map(l=>{const m=String(l).match(/^\s*([\w.]+)\s*=\s*([\d.]+)\s*([\w.]+)\s*$/);return m?{u:m[1],r:+m[2],b:m[3]}:null}).filter(Boolean)}
function convFactor(from,to){if(from===to)return 1;const C=unitConvs();let d=C.find(c=>c.u===from&&c.b===to);if(d)return d.r;d=C.find(c=>c.u===to&&c.b===from);if(d)return 1/d.r;const a=C.find(c=>c.u===from),b=C.find(c=>c.u===to);if(a&&b&&a.b===b.b)return a.r/b.r;return 0}
const unitOpts=base=>{const o=[base];unitConvs().forEach(c=>[c.u,c.b].forEach(u=>{if(!o.includes(u)&&convFactor(u,base))o.push(u)}));return o};
const taxR=d=>DB.settings.taxOn?num(d.taxRate):0;
function cleanItems(d){const items=d.items.filter(i=>i.prod&&num(i.qty)>0).map(i=>{const p=prod(i.prod),u=i.unit||p.unit,f=convFactor(u,p.unit);if(!f)throw new Error('No unit conversion from '+u+' to '+p.unit+'. Add it in Settings > Units.');const uq=num(i.qty),ur=num(i.rate);return{prod:i.prod,qty:r2(uq*f),rate:ur/f,disc:r2(num(i.disc)),u,uq,ur}});
 if(!items.length)throw new Error('Add at least one product with a quantity.');
 if(!d.date)throw new Error('Please choose a date.');
 items.forEach(i=>{if(i.rate<0||i.disc<0)throw new Error('Rate and discount cannot be negative.');if(i.disc>r2(i.qty*i.rate)+0.005)throw new Error('Discount is more than the line amount for '+prod(i.prod).name+'.')});return items}
function normPays(pays,total){const o=[];(pays||[]).forEach(p=>{const a=r2(num(p.amt));if(a>0){const x=acc(p.acc);if(!x||!(x.sub==='cash'||x.sub==='bank'))throw new Error('Choose a cash or bank account for each payment.');o.push({acc:p.acc,amt:a})}});const paid=r2(o.reduce((s,p)=>s+p.amt,0));if(paid>total+0.001)throw new Error('Payments ('+money(paid)+') are more than the invoice total ('+money(total)+').');return{pays:o,paid}}
const payMix=s=>{let c=0,b=0;(s.pays||[]).forEach(p=>{const a=acc(p.acc);if(a&&a.sub==='bank')b+=p.amt;else c+=p.amt});return{cash:r2(c),bank:r2(b),credit:r2(s.total-s.paid)}};
function chkNeg(d,q,wh){const short=[];for(const p in q)if(q[p]>sq(p,wh)+1e-9)short.push(prod(p).name+' (have '+sq(p,wh)+', need '+q[p]+')');if(!short.length||DB.settings.negStock)return;
 if(!d.authNeg){const e=new Error('Not enough stock in '+whName(wh)+': '+short.join(', ')+'.');e.code='NEG';throw e}
 if(ME.role!=='admin')throw new Error('Only the administrator can authorize negative stock.');audit('Negative stock override','Inventory',short.join('; '),null,{wh})}
function postSale(d){need('sales');return tx(()=>{
 const items=cleanItems(d),T=calc(items,taxR(d)),{pays,paid}=normPays(d.pays,T.total);
 const cu=d.party?cust(d.party):null;if(!cu)throw new Error('Please choose a customer.');
 const phone=String(d.phone!=null&&String(d.phone).trim()?d.phone:(cu.phone||'')).trim();
 if(!phone)throw new Error('Customer phone number is required before submitting the invoice.');
 if(phone!==(cu.phone||'').trim()){cu.phone=phone;audit('Updated','Customers',cu.name,null,{phone})}
 if(d.addr&&String(d.addr).trim())cu.address=String(d.addr).trim();
 const due=r2(T.total-paid);
 if(due>0&&cu.limit>0&&partyBal('c',cu.id)+due>cu.limit){if(!d.authLimit){const e=new Error('Credit limit of '+money(cu.limit)+' would be exceeded for '+cu.name+'.');e.code='LIMIT';throw e}if(ME.role!=='admin')throw new Error('Only the administrator can authorize a credit-limit exception.');audit('Credit limit override','Sales',cu.name,null,{limit:cu.limit,due})}

function postSaleReturn(d){need('sales');return tx(()=>{

  const last=r2(q+it.ret-it.qty)===0,g=r2(it.rate*q),dsc=last?r2(it.disc-it.discRet):r2(it.disc*q/it.qty),c=last?r2(it.cost-it.costRet):r2(it.cost*q/it.qty);

const CATIN={sale:'Sales received',cpay:'Customer receipts',cashtx:'Other receipts',transfer:'Transfers in',open:'Opening balances',pret:'Purchase refunds',dispose:'Asset sale proceeds',reversal:'Reversals of cancelled items',manual:'Journal entries',cashclose:'Cash excess adjustment'};
const CATOUT={purchase:'Purchases paid',spay:'Supplier payments',expense:'Expenses',sret:'Customer refunds',cashtx:'Withdrawals / other payments',transfer:'Transfers out',asset:'Asset purchases',reversal:'Reversals of cancelled items',manual:'Journal entries',cashclose:'Cash shortage adjustment'};
function cashBreak(subs,f,t,isCash){const codes=DB.accounts.filter(a=>subs.includes(a.sub)).map(a=>a.code);let open=0,tinx=0,toutx=0;const gi={},go_={};
 for(const j of DB.journal){const ty=(j.src&&j.src.type)||'manual';for(const l of j.lines){if(!codes.includes(l.acc))continue;const x=l.dr-l.cr;if(j.date<f){open+=x;continue}if(j.date>t)continue;
  if(x>=0){let k=CATIN[ty]||'Other receipts';if(ty==='sale')k=isCash?'Cash sales':'Bank receipts from sales';gi[k]=(gi[k]||0)+x;if(ty!=='transfer'&&ty!=='open')tinx+=x}
  else{let k=CATOUT[ty]||'Other payments';if(ty==='purchase')k=isCash?'Cash purchases':'Bank purchases';go_[k]=(go_[k]||0)-x;if(ty!=='transfer')toutx-=x}}}
 const ins=Object.entries(gi).map(([l,v])=>({l,v:r2(v)})).filter(x=>x.v),outs=Object.entries(go_).map(([l,v])=>({l,v:r2(v)})).filter(x=>x.v);
 const tin=r2(ins.reduce((a,x)=>a+x.v,0)),tout=r2(outs.reduce((a,x)=>a+x.v,0));return{open:r2(open),ins,outs,tin,tout,tinx:r2(tinx),toutx:r2(toutx),close:r2(open+tin-tout)}}
function breakRows(B,w){const o=w||'Opening',r=[{cl:'s',c:[o,N(B.open)]},{cl:'h',c:['Money in','']}];B.ins.forEach(x=>r.push({cl:'i',c:[x.l,N(x.v)]}));r.push({cl:'s',c:['Total in',N(B.tin)]},{cl:'h',c:['Money out','']});B.outs.forEach(x=>r.push({cl:'i',c:[x.l,N(x.v)]}));r.push({cl:'s',c:['Total out',N(B.tout)]},{cl:'s',c:['Closing',N(B.close)]});return r}
function openJ(jid){const j=DB.journal.find(x=>x.id===jid);if(!j)return;const t=(j.src&&j.src.type)||'manual',id=j.src&&j.src.id,m={sale:'saledet',purchase:'purdet',expense:'expdet',asset:'assetdet',depr:'assetdet',dispose:'assetdet'};
 if(m[t]&&id&&(t!=='sale'||DB.sales.some(x=>x.id===id))&&(t!=='purchase'||DB.purchases.some(x=>x.id===id)))go(m[t],id);else if((t==='sret')&&id)go('retdet','s:'+id);else if(t==='pret'&&id)go('retdet','p:'+id);else go('jedet',jid)}

function bookPage(kind,title,acts){const isB=kind==='bank',key=isB?'bk_b':'bk_c',r=rg(key,'month'),list=DB.accounts.filter(a=>a.sub===kind),cur=ST['bs_'+kind]||'all',codes=cur==='all'?list.map(a=>a.code):[cur],f=FL(key),q=(f.q||'').toLowerCase();
 let open=0;const rows=[];[...DB.journal].sort(byD).forEach(j=>j.lines.forEach(l=>{if(!codes.includes(l.acc))return;const x=l.dr-l.cr;if(j.date<r.f)open+=x;else if(j.date<=r.t)rows.push({j,x})}));
 let run=r2(open),dep=0,wd=0;const all=rows.map(o=>{run=r2(run+o.x);if(o.x>0)dep+=o.x;else wd-=o.x;return{o,run}}),disp=all.filter(a=>!q||(a.o.j.no+' '+a.o.j.desc+' '+a.o.j.ref).toLowerCase().includes(q));

 ${rptWrap(title,fd(r.f)+' to '+fd(r.t),`<div class="kp">${kpi('Opening balance',money(open))}${kpi(isB?'Total deposits':'Total received',money(dep),'g')}${kpi(isB?'Total withdrawals':'Total paid',money(wd),'r')}${kpi('Closing balance',money(run))}</div>${tbl(['Date','Voucher','Description',isB?'Deposit':'Received',isB?'Withdrawal':'Paid','Balance'],disp.map(a=>({c:[fd(a.o.j.date),a.o.j.no,esc(a.o.j.desc),a.o.x>0?N(a.o.x):'',a.o.x<0?N(-a.o.x):'',N(a.run)],oc:`openJ('${a.o.j.id}')`})),{num:[3,4,5]})}`)}`}}

function saveBank(d){need('cash');return tx(()=>{if(!d.bank.trim())throw new Error('Bank name is required.');let c=1011;while(acc(String(c)))c++;const code=String(c),nm=d.bank.trim()+(d.no?' ('+String(d.no).slice(-4)+')':'');

R.rdepr=()=>{const r=rg('rd','year'),L=DB.depr.filter(d=>inR(d.date,r.f,r.t)).sort(byD);return{t:'Depreciation Report',h:rgUI('rd',PLP)+rptWrap('Depreciation report',fd(r.f)+' to '+fd(r.t),tbl(['Date','Asset','Months','Amount'],L.map(d=>[fd(d.date),esc((DB.assets.find(a=>a.id===d.asset)||{}).name),d.months,N(d.amt)]).concat([{cl:'s',c:['Total','','',N(L.reduce((s,d)=>s+d.amt,0))]}]),{num:[2,3]}))}};
R.stockled=()=>{const r=rg('sl','month'),pid=ST.slp||(DB.products[0]||{}).id,L=DB.stockTx.filter(s=>s.prod===pid).sort(byD),rows=[];let o=0;
 L.forEach(s=>{if(s.date<r.f)o=s.rq;else if(s.date<=r.t)rows.push([fd(s.date),esc(s.type+' '+s.ref),esc(whName(s.wh)),s.qty>0?s.qty:'',s.qty<0?-s.qty:'',s.qty?N(Math.abs(s.val/s.qty)):'',N(Math.abs(s.val)),s.rq,N(s.rv),N(s.ra)])});
 return{t:'Stock Ledger',h:`<div class="card noprint"><label>Product${prodSel('slp',pid).replace('<select','<select onchange="ST.slp=this.value;render()"')}</label></div>${rgUI('sl',PLP)}${rptWrap('Stock ledger - '+esc((prod(pid)||{}).name||''),fd(r.f)+' to '+fd(r.t)+' · opening qty '+o+' · weighted average cost',tbl(['Date','Type','Location','In','Out','Unit cost','Total cost','Run. qty','Run. value','Avg cost'],rows,{num:[3,4,5,6,7,8,9]}))}`}};

/* ================= SETTINGS, USERS, AUDIT ================= */
R.settings=()=>{const s=DB.settings,w=can('settings',true),dis=w?'':'disabled',F=(k,l,t)=>`<label>${l}<input id="s_${k}" ${dis} ${t?`type="${t}"`:''} value="${esc(s[k]||'')}"></label>`;
 return{t:'Settings',h:`${w?'':'<small>View only for your role.</small>'}
 <details class="set" open><summary><b>Business information</b></summary>${F('biz','Business name')}${F('addr','Address')}<div class="g2">${F('phone','Phone')}${F('email','Email')}</div><div class="g2">${F('ntn','NTN')}${F('strn','STRN')}</div>${F('cur','Currency symbol (Rs = PKR)')}<label>Invoice terms<textarea id="s_terms" ${dis}>${esc(s.terms)}</textarea></label><label>Logo<input type="file" accept="image/*" ${dis} onchange="readImg(this.files[0],220,u=>{ST.logo=u;toast('Logo ready: tap Save')})"></label><button class="btn block" ${dis} onclick="act(saveBiz)">Save business info</button></details>
 <details class="set"><summary><b>Tax</b> (currently ${s.taxOn?'ON':'OFF'})</summary><label>Use tax on invoices<select id="s_taxon" ${dis}>${opt('0','No - tax is not used',s.taxOn?'1':'0')}${opt('1','Yes - show tax on invoices',s.taxOn?'1':'0')}</select></label><small>Tax rates, one per line as: Name | rate. Nothing is hard-coded, so edit when rules change.</small><textarea id="s_tax" rows="4" ${dis}>${esc(s.taxes.map(t=>t.name+' | '+t.rate).join('\n'))}</textarea><button class="btn block" ${dis} onclick="act(()=>{saveSet(()=>{DB.settings.taxOn=v('s_taxon')==='1';DB.settings.taxes=parseLines(v('s_tax')).map(([n,r])=>({name:n,rate:num(r)}));if(!DB.settings.taxes.length)throw new Error('Add at least one tax line.')})})">Save tax settings</button></details>
 <details class="set"><summary><b>Stock rules</b></summary><label>Valuation method<select disabled><option>Weighted average cost (FIFO can be added later)</option></select></label><label>Negative stock<select id="s_neg" ${dis}>${opt('0','Not allowed - administrator can authorize exceptions',s.negStock?'1':'0')}${opt('1','Always allowed',s.negStock?'1':'0')}</select></label><label>Financial year starts in<select id="s_fy" ${dis}>${[...Array(12)].map((_,i)=>opt(i+1,new Date(2000,i,1).toLocaleDateString('en-GB',{month:'long'}),s.fyStart)).join('')}</select></label><button class="btn block" ${dis} onclick="act(()=>{saveSet(()=>{DB.settings.negStock=v('s_neg')==='1';DB.settings.fyStart=+v('s_fy')})})">Save</button></details>
 <details class="set"><summary><b>Units & categories</b></summary><label>Units (comma separated)<input id="s_units" ${dis} value="${esc(s.units.join(', '))}"></label><label>Unit conversions, one per line (example: box = 12 pcs)<textarea id="s_conv" rows="4" ${dis}>${esc((s.unitConv||[]).join('\n'))}</textarea></label><label>Product categories (comma separated)<input id="s_cats" ${dis} value="${esc(s.cats.join(', '))}"></label><button class="btn block" ${dis} onclick="act(()=>{saveSet(()=>{DB.settings.units=v('s_units').split(',').map(x=>x.trim()).filter(Boolean);DB.settings.unitConv=v('s_conv').split('\n').map(x=>x.trim()).filter(Boolean);DB.settings.cats=v('s_cats').split(',').map(x=>x.trim()).filter(Boolean)})})">Save</button></details>
 <details class="set"><summary><b>Expense categories</b></summary><small>One per line: Category | account code. Each category posts to its own ledger account.</small><textarea id="s_exp" rows="8" ${dis}>${esc(s.expCats.map(c=>c.name+' | '+c.acc).join('\n'))}</textarea><button class="btn block" ${dis} onclick="act(()=>{saveSet(()=>{DB.settings.expCats=parseLines(v('s_exp')).map(([n,a])=>{if(!acc(a))throw new Error('Unknown account '+a+' for '+n);return{name:n,acc:a}})})})">Save</button></details>
 <details class="set"><summary><b>Backup & restore</b></summary><label>Automatic backup<select id="s_ab" ${dis}>${[['daily','Every day (when the app opens)'],['weekly','Every week'],['off','Off']].map(([a,b])=>opt(a,b,s.autoBackup)).join('')}</select></label><button class="btn sec block" ${dis} onclick="act(()=>{saveSet(()=>{DB.settings.autoBackup=v('s_ab')})})">Save schedule</button>
 <div class="btns"><button class="btn sec" onclick="act(()=>{makeSnap('m');toast('Backup saved on this phone');render()})">Back up now</button><button class="btn sec" onclick="backup()">Copy backup text</button><button class="btn sec" onclick="restoreUI()">Restore from text</button></div>
 <small>Backups saved on this device:</small>${snaps().map(k=>rowH(snapName(k),k.endsWith('a')?'automatic':k.endsWith('s')?'safety copy before restore':'manual','',`ask('Restore this backup? Your current data is saved as a safety copy first.',()=>restoreSnap('${k}'),'Restore','')`)).join('')||'<div class="empty">No backups yet.</div>'}<small>Tip: also copy the backup text somewhere safe (email it to yourself). Clearing browser data erases device backups.</small></details>
 ${w?`<details class="set"><summary><b>Danger zone</b></summary><button class="btn bad block" onclick="ask('Delete ALL data and load the demo data again?',()=>resetData(true),'Reset to demo')">Reset to demo data</button><button class="btn bad block" onclick="ask('Delete ALL data and start with empty books? Users are kept. Your current data is saved as a safety copy.',()=>resetData(false),'Start empty')">Start with empty books</button></details>`:''}`}};
function parseLines(t){return t.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&a[1]!==undefined&&a[1]!=='')}
function saveSet(fn){need('settings');tx(()=>{fn();audit('Updated','Settings','settings')});toast('Saved');render()}
function saveBiz(){saveSet(()=>{const s=DB.settings;['biz','addr','phone','email','ntn','strn','cur','terms'].forEach(k=>s[k]=v('s_'+k));if(ST.logo)s.logo=ST.logo})}
function snaps(){const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('bizbooks_bk_'))o.push(k)}}catch(e){}return o.sort().reverse()}
function snapName(k){const m=k.match(/bk_(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]+' '+m[4]+':'+m[5]:k}
function makeSnap(label){try{const d=new Date(),p=n=>String(n).padStart(2,'0'),k='bizbooks_bk_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+(label||'m');localStorage.setItem(k,JSON.stringify(DB));snaps().slice(8).forEach(x=>localStorage.removeItem(x));return k}catch(e){throw new Error('Could not save the backup (storage is full).')}}
function autoBackup(){const m=DB.settings.autoBackup;if(!m||m==='off')return;const last=DB.settings.lastBackup||'',td=today(),due=m==='daily'?last!==td:(!last||(new Date(td)-new Date(last))/864e5>=7);if(due){try{makeSnap('a');DB.settings.lastBackup=td;save()}catch(e){}}}
function restoreData(d){if(!d||!d.accounts||!d.journal||!d.settings)throw new Error('This is not a valid backup.');makeSnap('s');DB=d;IDX=null;save();ME=null;try{localStorage.removeItem(SK)}catch(e){}render();toast('Restored. Please log in.')}
function restoreSnap(k){restoreData(JSON.parse(localStorage.getItem(k)))}
function backup(){showModal(`<h3>Backup</h3><small>Copy this text and keep it safe. Paste it back under "Restore from text".</small><textarea rows="8" readonly onfocus="this.select()">${esc(JSON.stringify(DB))}</textarea><div class="btns"><button class="btn" onclick="closeModal()">Done</button></div>`)}
function restoreUI(){showModal(`<h3>Restore backup</h3><small class="neg">This replaces everything on this phone. A safety copy of your current data is saved first.</small><textarea id="rb" rows="8" placeholder="Paste backup text here"></textarea><div class="btns"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn bad" onclick="act(()=>{const d=JSON.parse(v('rb'));closeModal();restoreData(d)})">Restore</button></div>`)}
async function resetData(demo){try{makeSnap('s')}catch(e){}const users=DB.users;DB=freshDB();DB.users=users;if(demo){const m=ME;ME=DB.users[0];seedDemo();ME=m}save();toast('Data reset');root('home')}
R.users=()=>({t:'Users & Permissions',a:`<button class="btn sm" onclick="go('userform')">+ New</button>`,h:DB.users.map(u=>rowH(esc(u.name)+' ('+esc(u.un)+')',ROLES[u.role].name+(u.active?'':' · disabled'),'',`go('userform','${u.id}')`)).join('')+`<h3 style="margin-top:14px">What each role can do</h3>${tbl(['Role','Access'],Object.values(ROLES).map(r=>[r.name,r.p.all?'Everything':Object.entries(r.p).map(([k,x])=>k+(x==='w'?'':' (view)')).join(', ')]))}<small>Access areas: dash, sales, purchase, inventory, expenses, cash, accounting, assets, reports, settings. "(view)" = read only.</small>`});
R.userform=id=>{const u=id?DB.users.find(x=>x.id===id):{role:'viewer',active:true};return{t:id?'Edit user':'New user',h:`<div class="card"><label>Full name<input id="un1" value="${esc(u.name||'')}"></label><label>Username<input id="un2" autocapitalize="none" value="${esc(u.un||'')}" ${id?'disabled':''}></label><label>${id?'New password (leave empty to keep)':'Password (min 6 characters)'}<input id="un3" type="password"></label><label>Role<select id="un4">${Object.entries(ROLES).map(([k,r])=>opt(k,r.name,u.role)).join('')}</select></label><label>Status<select id="un5">${opt('1','Active',u.active?'1':'0')}${opt('0','Disabled',u.active?'1':'0')}</select></label></div>
 <button class="btn block" onclick="saveUser(${id?`'${id}'`:'null'})">Save user</button>`}};
async function saveUser(id){try{if(ME.role!=='admin')throw new Error('Only the administrator can manage users.');const name=v('un1').trim(),un=(id?DB.users.find(x=>x.id===id).un:v('un2').trim().toLowerCase()),pw=v('un3');if(!name||!un)throw new Error('Name and username are required.');
 if(!id&&(pw.length<6||DB.users.some(x=>x.un===un)))throw new Error(pw.length<6?'Password must be at least 6 characters.':'Username already exists.');if(id&&pw&&pw.length<6)throw new Error('Password must be at least 6 characters.');
 if(id===ME.id&&(v('un4')!=='admin'||v('un5')!=='1'))throw new Error('You cannot remove your own admin access.');
 const h=pw?await sha(un+':'+pw):null;tx(()=>{if(id){const u=DB.users.find(x=>x.id===id);u.name=name;u.role=v('un4');u.active=v('un5')==='1';if(h)u.hash=h}else DB.users.push({id:uid(),un,name,role:v('un4'),hash:h,active:true});audit(id?'Updated':'Created','Users',un)});toast('Saved');back()}catch(e){toast(e.message,'err')}}
R.audit=()=>{const f=FL('audit');return{t:'Audit Log',h:listShell('audit',{ph:'Search user, action, module, record'})}};
LIST.audit=()=>{const f=FL('audit'),q=f.q.toLowerCase();return more([...DB.audit].reverse().filter(a=>!q||(a.user+' '+a.action+' '+a.module+' '+a.rec).toLowerCase().includes(q)),'audit',a=>rowH(esc(a.action)+' · '+esc(a.module),esc(a.user)+' · '+new Date(a.t).toLocaleString('en-GB'),esc(a.rec),'',a.n?esc(a.n.slice(0,40)):''))};

async function init(){
 DB=load();
 if(!DB||!DB.accounts){DB=freshDB();const U=[['admin','Administrator','admin','admin123'],['accountant','Accountant','accountant','acc123'],['sales','Salesperson','sales','sales123'],['viewer','Viewer','viewer','view123']];
  for(const[un,name,role,pw]of U)DB.users.push({id:'u_'+un,un,name,role,hash:await sha(un+':'+pw),active:true});
  ME=DB.users[0];try{seedDemo()}catch(e){console.error(e)}ME=null;save()}
 try{const id=localStorage.getItem(SK);ME=id?(DB.users.find(u=>u.id===id&&u.active)||null):null}catch(e){}
 autoBackup();if(ME)autoRecurring();render()}
init();
</script>
